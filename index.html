<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nasuta.pl</title>
  <meta name="description" content="nasuta.pl — Something is taking shape." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#040406" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #040406;
      --ink: #f0ede6;
      --ink-dim: rgba(240, 237, 230, 0.45);
      --ink-whisper: rgba(240, 237, 230, 0.22);
      --amber: #df9b52;
      --cyan: #64d2db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    canvas#scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
      cursor: crosshair;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, transparent 45%, rgba(2, 2, 4, 0.82) 100%);
    }

    .grain {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.032;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      padding: clamp(1.5rem, 3.5vw, 2.75rem);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-dim);
      font-weight: 300;
    }

    .brand {
      color: var(--ink);
      letter-spacing: 0.34em;
      font-weight: 400;
    }

    .code-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      color: var(--ink-dim);
    }

    .pulse-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 10px var(--amber);
      animation: blink 3.2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }

    .title-block {
      position: fixed;
      left: 50%;
      bottom: clamp(4.25rem, 9.5vh, 6.5rem);
      transform: translateX(-50%);
      z-index: 3;
      pointer-events: none;
      text-align: center;
      width: max-content;
      max-width: 92vw;
      padding: 0.5rem 2rem;
    }

    .whisper-top {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.6rem;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--amber);
      opacity: 0;
      margin-bottom: 0.75rem;
      animation: fadeUp 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    h1 {
      font-family: "Outfit", sans-serif;
      font-weight: 200;
      font-size: clamp(1.3rem, 2.9vw, 2.3rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink);
      line-height: 1.3;
      margin-right: -0.28em;
      background: linear-gradient(90deg, rgba(240,237,230,0.75) 0%, #ffffff 50%, rgba(223,155,82,0.88) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      animation: fadeUp 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(223, 155, 82, 0.5), transparent);
      margin: 0.9rem auto;
      opacity: 0;
      animation: fadeUp 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.65s forwards;
    }

    .riddle {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.64rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink-dim);
      font-weight: 300;
      opacity: 0;
      animation: fadeUp 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
    }

    .riddle span {
      display: inline-block;
      margin: 0 0.65rem;
      color: var(--amber);
      opacity: 0.6;
    }

    .telemetry {
      font-variant-numeric: tabular-nums;
      transition: color 0.3s ease;
    }

    .telemetry.active {
      color: var(--amber);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      .hud-row {
        font-size: 0.58rem;
        letter-spacing: 0.14em;
      }
      h1 {
        font-size: 1.1rem;
        letter-spacing: 0.18em;
        margin-right: -0.18em;
        white-space: normal;
      }
      .riddle {
        font-size: 0.54rem;
        letter-spacing: 0.16em;
      }
      .riddle span {
        margin: 0 0.3rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="title-block" id="titleBlock">
    <p class="whisper-top">0x00 // Unannounced</p>
    <h1>Something is taking shape</h1>
    <div class="divider" aria-hidden="true"></div>
    <p class="riddle">
      Layer by layer<span>·</span>Note by note<span>·</span>Line by line
    </p>
  </div>

  <div class="hud">
    <div class="hud-row">
      <span class="brand">nasuta.pl</span>
      <span class="code-tag">
        <span class="pulse-dot"></span>
        <span id="stateReadout">&lt;state:materializing /&gt;</span>
      </span>
    </div>

    <div class="hud-row">
      <span class="telemetry" id="freqTelemetry">41.20 Hz · 55.00 Hz · 73.42 Hz · 98.00 Hz</span>
      <span class="telemetry" id="layerTelemetry">Z: 0.20mm // 215°C</span>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");
      const titleBlock = document.getElementById("titleBlock");
      const freqTelemetry = document.getElementById("freqTelemetry");
      const layerTelemetry = document.getElementById("layerTelemetry");
      const stateReadout = document.getElementById("stateReadout");

      let w = 0;
      let h = 0;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener("resize", resize);
      resize();

      // Web Audio bass string synthesis (warm fundamental + harmonics audible on all speakers)
      let audioCtx = null;
      let masterBus = null;

      function ensureAudioContext() {
        try {
          if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return null;
            audioCtx = new AudioContext();

            const compressor = audioCtx.createDynamicsCompressor();
            compressor.threshold.setValueAtTime(-14, audioCtx.currentTime);
            compressor.knee.setValueAtTime(12, audioCtx.currentTime);
            compressor.ratio.setValueAtTime(4, audioCtx.currentTime);
            compressor.attack.setValueAtTime(0.005, audioCtx.currentTime);
            compressor.release.setValueAtTime(0.18, audioCtx.currentTime);
            compressor.connect(audioCtx.destination);
            masterBus = compressor;
          }
          if (audioCtx.state === "suspended") {
            audioCtx.resume().catch(function () {});
          }
          return audioCtx;
        } catch (_) {
          return null;
        }
      }

      function playSubtleBassTone(freq, velocity) {
        try {
          const ctxAudio = ensureAudioContext();
          if (!ctxAudio || !masterBus) return;

          const vel = Math.max(0.35, Math.min(1.0, velocity || 0.75));

          function triggerVoice() {
            const now = ctxAudio.currentTime;
            const duration = 2.4;

            // 1. Sub/Fundamental body (triangle)
            const oscFund = ctxAudio.createOscillator();
            oscFund.type = "triangle";
            oscFund.frequency.setValueAtTime(freq * 1.008, now);
            oscFund.frequency.exponentialRampToValueAtTime(freq, now + 0.045);

            // 2. Warm string harmonics (sawtooth)
            const oscHarm = ctxAudio.createOscillator();
            oscHarm.type = "sawtooth";
            oscHarm.frequency.setValueAtTime(freq, now);
            oscHarm.detune.setValueAtTime(3.5, now);

            // 3. Octave presence (2nd harmonic) so low E1/A1 cut through laptop/phone speakers
            const oscOct = ctxAudio.createOscillator();
            oscOct.type = "triangle";
            oscOct.frequency.setValueAtTime(freq * 2, now);

            const gainFund = ctxAudio.createGain();
            const gainHarm = ctxAudio.createGain();
            const gainOct = ctxAudio.createGain();

            gainFund.gain.setValueAtTime(0.55, now);
            gainHarm.gain.setValueAtTime(0.32, now);
            gainOct.gain.setValueAtTime(0.22, now);

            // Pluck lowpass filter envelope
            const filter = ctxAudio.createBiquadFilter();
            filter.type = "lowpass";
            filter.Q.setValueAtTime(2.4, now);
            const attackCutoff = Math.min(2800, Math.max(freq * 10, 620)) * (0.65 + 0.35 * vel);
            filter.frequency.setValueAtTime(attackCutoff, now);
            filter.frequency.exponentialRampToValueAtTime(freq * 3.2, now + 0.28);
            filter.frequency.exponentialRampToValueAtTime(freq * 1.5, now + duration);

            // Amplitude envelope
            const voiceGain = ctxAudio.createGain();
            const peakGain = 0.28 * vel;
            voiceGain.gain.setValueAtTime(0.0001, now);
            voiceGain.gain.linearRampToValueAtTime(peakGain, now + 0.01);
            voiceGain.gain.exponentialRampToValueAtTime(peakGain * 0.42, now + 0.22);
            voiceGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

            oscFund.connect(gainFund);
            oscHarm.connect(gainHarm);
            oscOct.connect(gainOct);

            gainFund.connect(filter);
            gainHarm.connect(filter);
            gainOct.connect(filter);

            filter.connect(voiceGain);
            voiceGain.connect(masterBus);

            oscFund.start(now);
            oscHarm.start(now);
            oscOct.start(now);

            oscFund.stop(now + duration + 0.05);
            oscHarm.stop(now + duration + 0.05);
            oscOct.stop(now + duration + 0.05);
          }

          if (ctxAudio.state === "running") {
            triggerVoice();
          } else {
            ctxAudio.resume().then(triggerVoice).catch(function () {});
          }
        } catch (_) {}
      }

      ["pointerdown", "touchstart", "keydown"].forEach(function (evt) {
        window.addEventListener(evt, ensureAudioContext, { passive: true });
      });

      // 4 foreground bass strings (G2, D2, A1, E1)
      const strings = [
        { hz: 98.00, label: "98.00 Hz [G2]", yFrac: 0.24, gauge: 1.0, amp: 0, vel: 0, phase: 0 },
        { hz: 73.42, label: "73.42 Hz [D2]", yFrac: 0.36, gauge: 1.35, amp: 0, vel: 0, phase: 1.2 },
        { hz: 55.00, label: "55.00 Hz [A1]", yFrac: 0.48, gauge: 1.75, amp: 0, vel: 0, phase: 2.4 },
        { hz: 41.20, label: "41.20 Hz [E1]", yFrac: 0.60, gauge: 2.25, amp: 0, vel: 0, phase: 3.6 }
      ];

      // 58 contour layers emerging from just above the title block and flowing UPWARD
      const NUM_LINES = 58;
      const lines = [];

      function initLineProps(obj, index) {
        obj.c1 = -0.18 + (Math.random() - 0.5) * 0.24;
        obj.c2 = 0.16 + (Math.random() - 0.5) * 0.24;
        obj.c3 = (Math.random() - 0.5) * 0.22;
        obj.w1 = 0.05 + Math.random() * 0.065;
        obj.w2 = 0.045 + Math.random() * 0.06;
        obj.w3 = 0.04 + Math.random() * 0.055;
        obj.a1 = 0.25 + Math.random() * 0.65;
        obj.a2 = 0.25 + Math.random() * 0.65;
        obj.a3 = 0.20 + Math.random() * 0.55;
        obj.f1 = 14 + Math.random() * 14;
        obj.f2 = 24 + Math.random() * 18;
        obj.ph = Math.random() * Math.PI * 2;
        obj.boost = 0;
        obj.isHighlight = (index % 19 === 0);
      }

      for (let i = 0; i < NUM_LINES; i++) {
        const item = { progress: i / NUM_LINES };
        initLineProps(item, i);
        lines.push(item);
      }

      let spawnCounter = NUM_LINES;
      let prevY = null;
      let pointerX = w * 0.5;
      let pointerY = h * 0.35;
      let resonanceEnergy = 0;

      function getOriginAndTopY() {
        const rect = titleBlock ? titleBlock.getBoundingClientRect() : null;
        // Start strictly above the title block so waves NEVER touch or darken the text
        const originY = rect ? Math.max(h * 0.52, rect.top - 22) : h * 0.68;
        const topLimitY = h * 0.05;
        return { originY: originY, topLimitY: topLimitY };
      }

      setTimeout(function () {
        strings[2].amp = 16;
        resonanceEnergy = 0.65;
      }, 800);

      function pluckString(s, direction, speed) {
        const bounds = getOriginAndTopY();
        const spanH = Math.max(100, bounds.originY - bounds.topLimitY);
        const sy = s.yFrac * h;
        const clampedSpeed = Math.min(Math.max(speed || 20, 10), 38);

        s.amp = (direction >= 0 ? 1 : -1) * Math.max(14, clampedSpeed * 1.25);
        resonanceEnergy = Math.min(1.6, resonanceEnergy + 0.55);

        // Excite lines near the plucked string's vertical position
        const targetProg = Math.max(0, Math.min(1, (bounds.originY - sy) / spanH));
        for (let k = 0; k < lines.length; k++) {
          const dist = Math.abs(lines[k].progress - targetProg);
          if (dist < 0.18) {
            lines[k].boost = Math.min(1.6, lines[k].boost + (1 - dist / 0.18) * 0.85);
          }
        }

        const normVel = Math.min(1.0, 0.45 + (clampedSpeed / 38) * 0.55);
        playSubtleBassTone(s.hz, normVel);

        if (freqTelemetry) {
          freqTelemetry.textContent = "RESONANCE // " + s.label;
          freqTelemetry.classList.add("active");
          clearTimeout(freqTelemetry._timer);
          freqTelemetry._timer = setTimeout(function () {
            freqTelemetry.classList.remove("active");
            freqTelemetry.textContent = "41.20 Hz · 55.00 Hz · 73.42 Hz · 98.00 Hz";
          }, 1600);
        }
      }

      window.addEventListener("pointerdown", function (e) {
        pointerX = e.clientX;
        pointerY = e.clientY;
        prevY = pointerY;

        // Find nearest string and pluck it on click/tap
        let closest = null;
        let minDist = Infinity;
        strings.forEach(function (s) {
          const sy = s.yFrac * h;
          const d = Math.abs(pointerY - sy);
          if (d < minDist) {
            minDist = d;
            closest = s;
          }
        });

        if (closest && minDist < h * 0.14) {
          const sy = closest.yFrac * h;
          pluckString(closest, pointerY >= sy ? 1 : -1, 24);
        }
      }, { passive: true });

      window.addEventListener("pointermove", function (e) {
        pointerX = e.clientX;
        pointerY = e.clientY;

        if (prevY !== null) {
          strings.forEach(function (s) {
            const sy = s.yFrac * h;
            if ((prevY < sy && pointerY >= sy) || (prevY > sy && pointerY <= sy)) {
              const speed = Math.min(Math.abs(pointerY - prevY), 38);
              pluckString(s, pointerY > prevY ? 1 : -1, speed);
            }
          });
        }
        prevY = pointerY;

        if (layerTelemetry) {
          const zVal = ((1 - pointerY / h) * 48.0).toFixed(2);
          layerTelemetry.textContent = "Z: " + zVal + "mm // 215°C";
        }
      }, { passive: true });

      let t = 0;

      function drawBottomEmergingWaves() {
        // Lines emerge from just above the title block (progress = 0 at originY)
        // and flow UPWARD toward the top edge of the screen (progress = 1 at topLimitY).
        const bounds = getOriginAndTopY();
        const originY = bounds.originY;
        const topLimitY = bounds.topLimitY;
        const totalSpanY = Math.max(120, originY - topLimitY);
        const maxPeakHeight = Math.min(h * 0.115, 96);

        resonanceEnergy *= 0.965;

        // Advance each line slowly upward (progress 0 -> 1)
        for (let i = 0; i < NUM_LINES; i++) {
          lines[i].progress += 0.00085;
          lines[i].boost *= 0.96;
          if (lines[i].progress >= 1.0) {
            lines[i].progress -= 1.0;
            spawnCounter++;
            initLineProps(lines[i], spawnCounter);
          }
        }

        // Draw from background (top, progress near 1.0) down to foreground (bottom near originY, progress near 0.0)
        // so closer lines cleanly occlude distant lines behind them without ever crossing below originY!
        const sorted = lines.slice().sort(function (a, b) {
          return b.progress - a.progress;
        });

        const numSamples = 110;
        const relCursorX = (pointerX / w) * 2 - 1;

        for (let i = 0; i < sorted.length; i++) {
          const row = sorted[i];
          const p = row.progress; // 0.0 at originY (just above text) -> 1.0 at topLimitY

          const baseY = originY - Math.pow(p, 0.94) * totalSpanY;

          // Perspective: wider near the bottom foreground (p=0), gently narrowing as it rises into the distance (p=1)
          const spanWidth = Math.min(w * 0.88, 860) * (1.0 - 0.28 * p);
          const startX = (w - spanWidth) * 0.5;

          // Smooth birth right above the text (p=0 -> 0.15) and smooth fade near the top edge (p -> 1.0)
          const birthEnv = Math.min(1, p * 6.5);
          const deathEnv = Math.pow(Math.max(0, 1 - p), 1.35);
          const rowEnv = birthEnv * deathEnv;

          const points = [];

          for (let j = 0; j <= numSamples; j++) {
            const uNorm = j / numSamples; // 0 to 1
            const u = uNorm * 2 - 1;      // -1 to +1
            const px = startX + uNorm * spanWidth;

            // Feather horizontal ends into flat darkness
            const edgeFeather = Math.pow(Math.max(0, 1 - u * u), 1.8);

            // Central organic ridge zone
            const centerEnvelope = Math.exp(-Math.pow(u / 0.46, 4));
            const g1 = row.a1 * Math.exp(-Math.pow((u - row.c1) / row.w1, 2));
            const g2 = row.a2 * Math.exp(-Math.pow((u - row.c2) / row.w2, 2));
            const g3 = row.a3 * Math.exp(-Math.pow((u - row.c3) / row.w3, 2));

            const phase = t * 0.024 + row.ph;
            const jagged =
              0.54 +
              0.28 * Math.sin(u * row.f1 + phase) +
              0.20 * Math.cos(u * row.f2 - phase * 1.25);

            // Subtle cursor ripple
            const distCursor = Math.abs(u - relCursorX);
            const cursorWave = Math.exp(-Math.pow(distCursor / 0.22, 2)) * 0.18;

            const boostSignal = (row.boost * 0.5 + resonanceEnergy * 0.35) * (0.65 + 0.35 * Math.sin(u * 16 - t * 0.15));

            const ridgeHeight =
              (g1 + g2 + g3 + cursorWave + boostSignal) *
              jagged *
              centerEnvelope *
              maxPeakHeight *
              rowEnv *
              edgeFeather;

            const py = baseY - ridgeHeight;
            points.push({ x: px, y: py });
          }

          // Hidden-line occlusion fill (clamped strictly at originY so it never touches the text block below!)
          const curtainBottomY = Math.min(originY, baseY + 12);
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          for (let j = 1; j < points.length; j++) {
            ctx.lineTo(points[j].x, points[j].y);
          }
          ctx.lineTo(points[points.length - 1].x, curtainBottomY);
          ctx.lineTo(points[0].x, curtainBottomY);
          ctx.closePath();
          ctx.fillStyle = "rgba(4, 4, 6, " + (0.92 * rowEnv) + ")";
          ctx.fill();

          // Feathered horizontal gradient stroke
          const grad = ctx.createLinearGradient(startX, baseY, startX + spanWidth, baseY);
          const alpha = Math.min(0.88, (0.16 + 0.54 * rowEnv + row.boost * 0.28) * rowEnv);

          if (row.isHighlight) {
            grad.addColorStop(0.0, "rgba(223, 155, 82, 0)");
            grad.addColorStop(0.18, "rgba(223, 155, 82, " + (alpha * 0.45) + ")");
            grad.addColorStop(0.5, "rgba(223, 155, 82, " + Math.min(0.92, alpha * 1.35) + ")");
            grad.addColorStop(0.82, "rgba(223, 155, 82, " + (alpha * 0.45) + ")");
            grad.addColorStop(1.0, "rgba(223, 155, 82, 0)");
            ctx.lineWidth = 1.25;
          } else {
            const warm = Math.min(1, row.boost * 0.65);
            const r = Math.round(205 + warm * 35);
            const g = Math.round(220 - warm * 35);
            const b = Math.round(226 - warm * 95);
            const rgb = r + ", " + g + ", " + b;

            grad.addColorStop(0.0, "rgba(" + rgb + ", 0)");
            grad.addColorStop(0.16, "rgba(" + rgb + ", " + (alpha * 0.35) + ")");
            grad.addColorStop(0.5, "rgba(" + rgb + ", " + alpha + ")");
            grad.addColorStop(0.84, "rgba(" + rgb + ", " + (alpha * 0.35) + ")");
            grad.addColorStop(1.0, "rgba(" + rgb + ", " + 0 + ")");
            ctx.lineWidth = 0.9 + warm * 0.35;
          }

          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          for (let j = 1; j < points.length; j++) {
            ctx.lineTo(points[j].x, points[j].y);
          }
          ctx.strokeStyle = grad;
          ctx.stroke();
        }
      }

      function drawForegroundStrings() {
        // Drawn LAST so the 4 bass strings remain on the first plan
        strings.forEach(function (s) {
          const sy = s.yFrac * h;

          const force = -0.22 * s.amp;
          s.vel = (s.vel + force) * 0.92;
          s.amp += s.vel;
          s.phase += 0.38;

          const energy = Math.min(Math.abs(s.amp) / 20, 1);

          // Dark halo behind string so it stays separated from the background lines
          ctx.beginPath();
          ctx.moveTo(0, sy);
          const segments = 72;
          for (let i = 1; i <= segments; i++) {
            const u = i / segments;
            const x = u * w;
            const env = Math.sin(u * Math.PI);
            const overtone = Math.sin(u * Math.PI * 3 + s.phase) * 0.16;
            const dy = (env + overtone * env) * s.amp;
            ctx.lineTo(x, sy + dy);
          }
          ctx.strokeStyle = "rgba(4, 4, 6, 0.78)";
          ctx.lineWidth = s.gauge + 4;
          ctx.stroke();

          // Foreground string stroke
          ctx.beginPath();
          ctx.moveTo(0, sy);
          for (let i = 1; i <= segments; i++) {
            const u = i / segments;
            const x = u * w;
            const env = Math.sin(u * Math.PI);
            const overtone = Math.sin(u * Math.PI * 3 + s.phase) * 0.16;
            const dy = (env + overtone * env) * s.amp;
            ctx.lineTo(x, sy + dy);
          }

          if (energy > 0.02) {
            ctx.shadowColor = "rgba(223, 155, 82, 0.9)";
            ctx.shadowBlur = 18 * energy + 4;
            ctx.strokeStyle = "rgba(235, 175, 105, " + (0.55 + energy * 0.45) + ")";
          } else {
            ctx.shadowColor = "rgba(240, 237, 230, 0.25)";
            ctx.shadowBlur = 4;
            ctx.strokeStyle = "rgba(240, 237, 230, 0.36)";
          }

          ctx.lineWidth = s.gauge;
          ctx.stroke();
          ctx.shadowBlur = 0;
        });
      }

      function tick() {
        t += 1;
        ctx.clearRect(0, 0, w, h);

        drawBottomEmergingWaves();
        drawForegroundStrings();

        if (t % 240 === 0 && stateReadout) {
          const states = [
            "<state:materializing />",
            "<layer:slicing />",
            "<signal:resonant />"
          ];
          stateReadout.textContent = states[Math.floor(t / 240) % states.length];
        }

        requestAnimationFrame(tick);
      }

      tick();
    })();
  </script>
</body>
</html>
